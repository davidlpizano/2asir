<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName davidservicios.ddns.net
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

SSLCertificateFile /etc/letsencrypt/live/davidservicios.ddns.net/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/davidservicios.ddns.net/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
